[package]
name = "asmov-common-dataset"
version = "0.0.1"
description = "Library for application data modeling between clients and servers"
authors = ["Asmov LLC <development.pub@asmov.software>"]
repository = "https://github.com/asmov/common"
homepage = "https://asmov.software"
license = "AGPL-3.0-or-later"
keywords = ["model", "db", "sql"]
categories = []
edition = "2021"

[dependencies]
asmov-common-dataset-enum = { path = "../dataset-enum" }
asmov-common-dataset-enum-derive = { path = "../dataset-enum-derive" }
asmov-common-traitenum = { version="1", default-features = false }
sqlx = { version = "0", optional = true, features = [
    "chrono",
    "runtime-tokio",
] }
wasm-bindgen = { version = "0", optional = true, features = ["serde"] }
bincode = { version = "2.0.0-rc", features = ["serde"] }
chrono = { version = "0", features = ["serde"] }
derivative = "2"
derive_builder = "0"
rustc-hash = "2"
send-future = "0.1"
thiserror = "1"
tokio-tungstenite = { version = "0.26", features = [
    "native-tls",
    "tokio-rustls",
] }

[features]
#default = []
#default = ["postgres"]
default = ["sqlite"]
#default = ["wasm"]
#default = ["postgres", "sqlite"]
sql = []
wasm = ["wasm-bindgen"]
postgres = ["sql", "sqlx/postgres"]
sqlite = ["sql", "sqlx/sqlite"]

[dev-dependencies]
asmov-common-testing = "2"
tokio = { version = "1", features = ["rt", "full"] }
tokio-test = "0"
wasm-bindgen = { version = "0", features = ["serde"] }
wasm-bindgen-test = { version = "0" }
wasm-bindgen-futures = { version = "0.4" }
js-sys = { version = "0.3" }
