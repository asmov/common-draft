[package]
name = "asmov-common-hardpath-macro-lib"
version = "0.1.0"
description = "Parsing library for Asmov Common Hardpath Macro"
authors = ["Asmov LLC <development.pub@asmov.software>"]
repository = "https://github.com/asmov/common"
homepage = "https://asmov.software"
license = "AGPL-3.0-or-later"
keywords = ["linux", "asmov", "common"]
categories = []
edition = "2024"

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
thiserror = "2"
bincode = "2"
